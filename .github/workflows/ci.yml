name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test -- --ci

      # Solo los archivos que cambia el PR (no el árbol completo).
      - name: Prettier (archivos cambiados)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff --name-only --diff-filter=ACMR "origin/${BASE_REF}...HEAD" \
            | grep -E '\.(ts|tsx|js|json|md)$' \
            | grep -v '^package-lock.json$' \
            | xargs -r npx prettier --check
